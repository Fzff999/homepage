<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>页面走丢了 · 付羿凡个人主页</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e3a8a'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Segoe UI,Arial,sans-serif' font-size='22' font-weight='800' fill='%23fff' text-anchor='middle'%3EFYF%3C/text%3E%3C/svg%3E" />
    <style>
        :root { --accent: #1e3a8a; --accent-2: #f97316; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; min-height: 100svh;
            display: grid; place-items: center;
            padding: 24px; text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #fafaf9; color: #1c1917;
        }
        .code {
            font-size: clamp(72px, 22vw, 140px); font-weight: 900; line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        h1 { font-size: clamp(18px, 4vw, 24px); margin: 16px 0 10px; }
        p { color: #57534e; font-size: 15px; line-height: 1.7; max-width: 420px; }
        a {
            display: inline-flex; align-items: center; justify-content: center;
            margin-top: 28px; padding: 12px 26px; border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
            box-shadow: 0 4px 14px rgba(30, 58, 138, .3);
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0c0a09; color: #fafaf9; }
            p { color: #a8a29e; }
        }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>这个页面走丢了</h1>
        <p>你访问的地址不存在，或者链接已经失效。回到主页看看吧。</p>
        <a href="./">← 返回个人信息主页</a>
    </main>
</body>
</html>
